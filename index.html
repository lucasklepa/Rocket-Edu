<!DOCTYPE html>

  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="logo" href="#rocket-table" aria-label="Rocket Edu — go to Rocket-Table">
        <img src="assets/logo-2x.png" alt="Rocket Edu" width="484" height="180">
      </a>

      <nav class="product-nav" aria-label="Products">
        <a href="#rocket-table">Rocket-Table</a>
        <a href="#orbit">Orbit</a>
        <a href="#lift-chair">Lift-Chair</a>
        <a href="#rocket-chair">Rocket-Chair</a>

      <p class="site-note">Website Videos<br>Raw cuts</p>

    <main>
      <section class="product" id="product-orbit" data-product="orbit" aria-label="Orbit">
        <figure class="hero">
          <div class="media-frame">
            <video class="media" muted loop playsinline preload="none"
                   poster="media/orbit/hero-poster.jpg"
                   data-src="media/orbit/hero.mp4"
                   aria-label="Orbit hero video"></video>
          </div>
          <figcaption class="sr-only">Orbit hero video</figcaption>
        </figure>

        <div class="features">
          <figure class="feature">
            <div class="media-frame">
              <video class="media" muted loop playsinline preload="none"
                     poster="media/orbit/feature-1-poster.jpg"
                     data-src="media/orbit/feature-1.mp4"
                     aria-label="Orbit — Dynamic Sitting and Posture Changes"></video>
            </div>
            <figcaption class="feature-info">
              <h3 class="feature-title">Dynamic Sitting &amp; Posture Changes</h3>
              <p class="feature-copy">Active sitting that keeps posture in motion.</p>
            </figcaption>
          </figure>

          <figure class="feature">
            <div class="media-frame">
              <video class="media" muted loop playsinline preload="none"
                     poster="media/orbit/feature-2-poster.jpg"
                     data-src="media/orbit/feature-2.mp4"
                     aria-label="Orbit — Space and Outdoor"></video>
            </div>
            <figcaption class="feature-info">
              <h3 class="feature-title">Space &amp; Outdoor</h3>
              <p class="feature-copy">Material and resistance for outdoor use.</p>

            <div class="media-frame">
              <video class="media" muted loop playsinline preload="none"
                     poster="media/orbit/feature-3-poster.jpg"
                     data-src="media/orbit/feature-3.mp4"
                     aria-label="Orbit — Mobility and Storage"></video>
            </div>
            <figcaption class="feature-info">
              <h3 class="feature-title">Mobility &amp; Storage</h3>
              <p class="feature-copy">Easy to move, easy to store.</p>
            </figcaption>
          </figure>
        </div>
      </section>

        <figure class="hero">

            <figcaption class="feature-info">
